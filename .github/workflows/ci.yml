        run: |
          test -f ports/esp-idf/smoke_app/sdkconfig.defaults.rrmp_on
          grep -F 'sdkconfig.defaults.rrmp_on' tools/esp_idf_ci_docker_run.sh
          NINLIL_ESP_CI_DRY_RUN=1 tools/rrmp_esp_idf_map_proof.sh
          grep -F '"status": "NOT_RUN"' tools/rrmp_hil_evidence_template.json

  # Host all-private coexistence + canonical actual-path evidence.
  # The six-call probe proves coexistence, not cross-feature E2E. The
  # host_completion_wire scenario is a test-only transport fixture. Canonical
  # Foundation owner-plane -> NFL1 E2Es run in an explicit Domain-OFF companion
  # profile until Domain public Runtime readiness is promoted.
  host-completion-integrated-e2e:
    name: Host all-private coexistence + canonical actual E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0
          check-latest: false
      - name: Install build deps
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libsqlite3-dev libssl-dev ninja-build binutils clang
      - name: Configure and build (all private features simultaneous ON)
        run: |
          set -euo pipefail
          # Simultaneous ON: domain + fabric + wifi + r7 frag + rrmp + mfdt.
          # Partial feature-ON trees (mfdt-only / wifi-only) are not substitutes.
          cmake -S . -B build/host-completion-allfeat -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DNINLIL_BUILD_TESTS=ON \
            -DNINLIL_ENABLE_DOMAIN_SCHEMA1_RUNTIME_BINDING=ON \
            -DNINLIL_ENABLE_PRIVATE_WIFI_V1=ON \
            -DNINLIL_ENABLE_PRIVATE_FABRIC_V1=ON \
            -DNINLIL_ENABLE_R7_FRAG_PRIVATE=ON \
            -DNINLIL_ENABLE_PRIVATE_ROUTE_RELAY_V1=ON \
            -DNINLIL_ENABLE_MFDT_V1_PRIVATE=ON \
            -DNINLIL_WIFI_ALLOW_UNPINNED_OPENSSL=ON
          # Configure/registration alone is not build evidence.
          cmake --build build/host-completion-allfeat \
            --target host_completion_all_private_build
          test -x build/host-completion-allfeat/ninlil_host_completion_all_private_coexistence_probe
          test -x build/host-completion-allfeat/ninlil_host_completion_transport_fixture_e2e
          # Aggregate also compile/links the canonical actual-path executable.
          # It cannot run in this exact tree while Domain public Runtime
          # readiness is false; the companion profile below owns execution.
          test -x build/host-completion-allfeat/ninlil_runtime_fabric_actual_e2e_test
          ctest --test-dir build/host-completion-allfeat -N \
            | grep -F 'host_completion_all_private_coexistence_probe' \
            || { echo "false-green: all-private coexistence probe not registered" >&2; exit 1; }
          ctest --test-dir build/host-completion-allfeat -N \
            | grep -F 'host_completion_transport_fixture_e2e' \
            || { echo "false-green: transport fixture not registered under all-features-ON" >&2; exit 1; }
          ctest --test-dir build/host-completion-allfeat -N \
            | grep -F 'traceability_registration_coverage_v2_check' \
            || { echo "false-green: all-private traceability gate not registered" >&2; exit 1; }
          ctest --test-dir build/host-completion-allfeat \
            --show-only=json-v1 \
            -R '^(runtime_fabric_actual_e2e|multi_service_node_host_actual_e2e|mfdt_v1_fabric_actual_e2e)$' \
            > build/host-completion-allfeat/actual-e2e-registry.json
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(
              "build/host-completion-allfeat/actual-e2e-registry.json")
          tests = {
              row["name"]: row
              for row in json.loads(path.read_text(encoding="utf-8"))["tests"]
          }
          expected = {
              "runtime_fabric_actual_e2e",
              "multi_service_node_host_actual_e2e",
              "mfdt_v1_fabric_actual_e2e",
          }
          if set(tests) != expected:
              print(
                  f"false-green: all-private actual E2E inventory={set(tests)!r}",
                  file=sys.stderr)
              raise SystemExit(1)
          for name, row in tests.items():
              disabled = any(
                  prop.get("name") == "DISABLED" and prop.get("value") is True
                  for prop in row.get("properties", []))
              if not disabled:
                  print(
                      "false-claim: Domain-ON actual E2E unexpectedly enabled "
                      f"before public Runtime readiness: {name}",
                      file=sys.stderr)
                  raise SystemExit(1)
          print("all-private actual E2E boundary: compile/link only, Domain readiness disabled")
          PY
          # Default-OFF must not register this test.
          cmake -S . -B build/host-completion-off -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DNINLIL_BUILD_TESTS=ON
          if ctest --test-dir build/host-completion-off -N \
            | grep -E 'host_completion_(all_private|transport)'; then
            echo "false-green: host_completion registered with features OFF" >&2
            exit 1
          fi
          # Single-feature MFDT-only tree must not be treated as all-features.
          cmake -S . -B build/host-completion-mfdt-only -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DNINLIL_BUILD_TESTS=ON \
            -DNINLIL_ENABLE_MFDT_V1_PRIVATE=ON
          if ctest --test-dir build/host-completion-mfdt-only -N \
            | grep -E 'host_completion_(all_private|transport)'; then
            echo "false-green: host_completion registered under MFDT-only (not all-features)" >&2
            exit 1
          fi
          # Profile-classifier mutation: Domain ON with one private feature
          # missing is neither baseline nor all-private.  Registering the
          # coverage check here would let a partial tree masquerade as a
          # complete profile.
          cmake -S . -B build/traceability-not-all-private -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DNINLIL_BUILD_TESTS=ON \
            -DNINLIL_ENABLE_DOMAIN_SCHEMA1_RUNTIME_BINDING=ON \
            -DNINLIL_ENABLE_PRIVATE_WIFI_V1=ON \
            -DNINLIL_ENABLE_PRIVATE_FABRIC_V1=ON \
            -DNINLIL_ENABLE_R7_FRAG_PRIVATE=ON \
            -DNINLIL_ENABLE_PRIVATE_ROUTE_RELAY_V1=ON \
            -DNINLIL_ENABLE_MFDT_V1_PRIVATE=OFF \
            -DNINLIL_WIFI_ALLOW_UNPINNED_OPENSSL=ON
          if ctest --test-dir build/traceability-not-all-private -N \
            | grep -F 'traceability_registration_coverage_v2_check'; then
            echo "false-green: partial private tree received a complete profile" >&2
            exit 1
          fi
          if ctest --test-dir build/traceability-not-all-private -N \
            | grep -E 'host_completion_(all_private|transport)'; then
            echo "false-green: partial private tree registered all-private Host tests" >&2
            exit 1
          fi
      - name: Traceability registration coverage V2 (all-private)
        run: |
          set -euo pipefail
          # The aggregate above proves the six-feature integration surface,
          # but the traceability manifest cites additional focused CTests.
          # Build the configured tree, execute the exact all-private cited set,
          # and let the gate reject any extraction omission via missing JUnit
          # PASS evidence.
          cmake --build build/host-completion-allfeat --parallel 2
          python3 - <<'PY' \
            > build/host-completion-allfeat/traceability-cited.regex
          import json
          import re

          manifest = json.load(open(
              "requirements-traceability-coverage.json",
              encoding="utf-8"))
          tests = set()
          for source in manifest["normative_sources"]:
              for unit in source["heading_units"]:
                  tests.update(unit["tests_by_profile"]["all-private"])
          for row in manifest["explicit_requirement_sets"]:
              tests.update(row["tests_by_profile"]["all-private"])
          for authority in manifest["delegated_authorities"]:
              tests.update(authority["tests_by_profile"]["all-private"])
          for invariant in manifest["invariant_source"]["invariants"]:
              for claim in invariant["subclaims"]:
                  for evidence in claim["evidence"]:
                      tests.update(
                          evidence["tests_by_profile"]["all-private"])
          if not tests:
              raise SystemExit("all-private traceability cited set is empty")
          print("^(" + "|".join(re.escape(name) for name in sorted(tests)) + ")$")
          PY
          ctest --test-dir build/host-completion-allfeat \
            --output-on-failure --no-tests=error \
            --output-junit \
              traceability-cited-junit.xml \
            -R "$(cat build/host-completion-allfeat/traceability-cited.regex)"
          python3 tools/traceability_complete_coverage_gate.py --self-test
          python3 tools/traceability_complete_coverage_gate.py --check \
            --profile all-private=build/host-completion-allfeat \
            --junit \
              all-private=build/host-completion-allfeat/traceability-cited-junit.xml
      - name: Canonical Foundation/Fabric/MFDT actual E2E (normal companion)
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          # Domain OFF is explicit: Domain public Runtime readiness is not yet
          # promoted. Wi-Fi/R7 FRAG/RRMP are enabled but not connected by these
          # actual E2Es; only Foundation owner-plane -> Fabric -> canonical
          # NFL1 and the MFDT carrier path are claimed here.
          cmake -S . -B build/host-completion-canonical-actual -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DNINLIL_BUILD_TESTS=ON \
            -DNINLIL_ENABLE_DOMAIN_SCHEMA1_RUNTIME_BINDING=OFF \
            -DNINLIL_ENABLE_PRIVATE_WIFI_V1=ON \
            -DNINLIL_ENABLE_PRIVATE_FABRIC_V1=ON \
            -DNINLIL_ENABLE_R7_FRAG_PRIVATE=ON \
            -DNINLIL_ENABLE_PRIVATE_ROUTE_RELAY_V1=ON \
            -DNINLIL_ENABLE_MFDT_V1_PRIVATE=ON \
            -DNINLIL_WIFI_ALLOW_UNPINNED_OPENSSL=ON
          cmake --build build/host-completion-canonical-actual \
            --target ninlil_runtime_fabric_actual_e2e_test
          ctest --test-dir build/host-completion-canonical-actual \
            --show-only=json-v1 \
            -R '^(runtime_fabric_actual_e2e|multi_service_node_host_actual_e2e|mfdt_v1_fabric_actual_e2e)$' \
            > build/host-completion-canonical-actual/actual-e2e-registry.json
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(
              "build/host-completion-canonical-actual/actual-e2e-registry.json")
          tests = {
              row["name"]: row
              for row in json.loads(path.read_text(encoding="utf-8"))["tests"]
          }
          expected = {
              "runtime_fabric_actual_e2e",
              "multi_service_node_host_actual_e2e",
              "mfdt_v1_fabric_actual_e2e",
          }
          if set(tests) != expected:
              print(
                  f"false-green: canonical actual inventory={set(tests)!r}",
                  file=sys.stderr)
              raise SystemExit(1)
          for name, row in tests.items():
              if any(
                  prop.get("name") == "DISABLED" and prop.get("value") is True
                  for prop in row.get("properties", [])):
                  print(
                      f"false-green: canonical actual test disabled: {name}",
                      file=sys.stderr)
                  raise SystemExit(1)
          print("canonical actual E2E registry: enabled 3/3")
          PY
          ctest --test-dir build/host-completion-canonical-actual \
            --output-on-failure --no-tests=error \
            -R '^(runtime_fabric_actual_e2e|multi_service_node_host_actual_e2e|mfdt_v1_fabric_actual_e2e)$'
      - name: Host all-private coexistence + transport fixture (normal)
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          # One-process six-feature coexistence proof plus test-only transport
          # fixture and its fail-closed negative self-test.
          ctest --test-dir build/host-completion-allfeat --output-on-failure \
            --no-tests=error \
            -R '^host_completion_(all_private_coexistence_probe|transport_fixture_e2e.*)$'
      - name: Host ASan/UBSan coexistence + actual E2E
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          # Sanitizer-enabled simultaneous all-features tree.
          cmake -S . -B build/host-completion-allfeat-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DNINLIL_ENABLE_SANITIZERS=ON \
            -DNINLIL_BUILD_TESTS=ON \
            -DNINLIL_ENABLE_DOMAIN_SCHEMA1_RUNTIME_BINDING=ON \
            -DNINLIL_ENABLE_PRIVATE_WIFI_V1=ON \
            -DNINLIL_ENABLE_PRIVATE_FABRIC_V1=ON \
            -DNINLIL_ENABLE_R7_FRAG_PRIVATE=ON \
            -DNINLIL_ENABLE_PRIVATE_ROUTE_RELAY_V1=ON \
            -DNINLIL_ENABLE_MFDT_V1_PRIVATE=ON \
            -DNINLIL_WIFI_ALLOW_UNPINNED_OPENSSL=ON
          # Compile/link the same aggregate under ASan/UBSan before execution.
          cmake --build build/host-completion-allfeat-asan \
            --target host_completion_all_private_build
          test -x build/host-completion-allfeat-asan/ninlil_host_completion_all_private_coexistence_probe
          test -x build/host-completion-allfeat-asan/ninlil_host_completion_transport_fixture_e2e
          test -x build/host-completion-allfeat-asan/ninlil_runtime_fabric_actual_e2e_test
          ctest --test-dir build/host-completion-allfeat-asan -N \
            | grep -F 'host_completion_all_private_coexistence_probe' \
            || { echo "false-green: all-private ASan coexistence probe missing" >&2; exit 1; }
          ctest --test-dir build/host-completion-allfeat-asan -N \
            | grep -F 'host_completion_transport_fixture_e2e' \
            || { echo "false-green: transport fixture missing under allfeat ASan" >&2; exit 1; }
          ctest --test-dir build/host-completion-allfeat-asan \
            --output-on-failure --no-tests=error \
            -R '^host_completion_(all_private_coexistence_probe|transport_fixture_e2e.*)$'

          # Canonical actual paths execute under the same sanitizer flags in a
          # Domain-OFF companion tree. Domain/Wi-Fi/R7 FRAG/RRMP cross-feature
          # connectivity remains explicitly unclaimed.
          cmake -S . -B build/host-completion-canonical-actual-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DNINLIL_ENABLE_SANITIZERS=ON \
            -DNINLIL_BUILD_TESTS=ON \
            -DNINLIL_ENABLE_DOMAIN_SCHEMA1_RUNTIME_BINDING=OFF \
            -DNINLIL_ENABLE_PRIVATE_WIFI_V1=ON \
            -DNINLIL_ENABLE_PRIVATE_FABRIC_V1=ON \
            -DNINLIL_ENABLE_R7_FRAG_PRIVATE=ON \
            -DNINLIL_ENABLE_PRIVATE_ROUTE_RELAY_V1=ON \
            -DNINLIL_ENABLE_MFDT_V1_PRIVATE=ON \
            -DNINLIL_WIFI_ALLOW_UNPINNED_OPENSSL=ON
          cmake --build build/host-completion-canonical-actual-asan \
            --target ninlil_runtime_fabric_actual_e2e_test
          ctest --test-dir build/host-completion-canonical-actual-asan \
            --show-only=json-v1 \
            -R '^(runtime_fabric_actual_e2e|multi_service_node_host_actual_e2e|mfdt_v1_fabric_actual_e2e)$' \
            > build/host-completion-canonical-actual-asan/actual-e2e-registry.json
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(
              "build/host-completion-canonical-actual-asan/"
              "actual-e2e-registry.json")
          tests = {
              row["name"]: row
              for row in json.loads(path.read_text(encoding="utf-8"))["tests"]
          }
          expected = {
              "runtime_fabric_actual_e2e",
              "multi_service_node_host_actual_e2e",
              "mfdt_v1_fabric_actual_e2e",
          }
          if set(tests) != expected:
              print(
                  f"false-green: ASan canonical actual inventory={set(tests)!r}",
                  file=sys.stderr)
              raise SystemExit(1)
          for name, row in tests.items():
              if any(
                  prop.get("name") == "DISABLED" and prop.get("value") is True
                  for prop in row.get("properties", [])):
                  print(
                      f"false-green: ASan canonical actual disabled: {name}",
                      file=sys.stderr)
                  raise SystemExit(1)
          print("ASan canonical actual E2E registry: enabled 3/3")
          PY
          ctest --test-dir build/host-completion-canonical-actual-asan \
            --output-on-failure --no-tests=error \
            -R '^(runtime_fabric_actual_e2e|multi_service_node_host_actual_e2e|mfdt_v1_fabric_actual_e2e)$'
  clang-non-sanitizer-hygiene:
    name: Ubuntu Clang non-sanitizer archive hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0
          check-latest: false
      - name: Install SQLite3, OpenSSL 3, ninja, binutils
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libsqlite3-dev libssl-dev ninja-build binutils
      - name: Configure (Clang, sanitizers OFF — ship hygiene gate)
        run: >-
          cmake -S . -B build/ci-clang-nosan -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DNINLIL_ENABLE_STRICT_WARNINGS=ON
          -DNINLIL_ENABLE_SANITIZERS=OFF
          -DNINLIL_SQLITE_LINKAGE=SHARED
      - name: Build
        run: cmake --build build/ci-clang-nosan --parallel 2
      - name: Test full matrix
        run: ctest --test-dir build/ci-clang-nosan --output-on-failure
      - name: R7 T0 crypto + T1 private wire + T1b binding acceptance (focused, non-sanitize)
        run: >-
          python3 tools/r7_t0_ctest_gate.py run-focused
          --build-dir build/ci-clang-nosan
          --profile normal &&
          python3 tools/nrw1_t1_ctest_gate.py run-focused
          --build-dir build/ci-clang-nosan
          --profile normal &&
          python3 tools/r7_t1b_ctest_gate.py run-focused
          --build-dir build/ci-clang-nosan
          --profile normal
      - name: Strict archive strings/ar/readelf path hygiene (ship gate)
        run: |
          set -euo pipefail
          a=build/ci-clang-nosan/libninlil_posix_sqlite_storage.a
          test -f "$a"
          # Must NOT be a sanitizer build — skip path is explicit-flag only.
          if grep -E 'NINLIL_ENABLE_SANITIZERS:BOOL=ON' \
               build/ci-clang-nosan/CMakeCache.txt; then
            echo "false-green: sanitizers ON in non-sanitizer hygiene job" >&2
            exit 1
          fi
          for n in \
            "$PWD/build/ci-clang-nosan/" \
            "$PWD/build/ci-clang-nosan" \
            "$PWD/ports/" \
            "$PWD/include/" \
            "$PWD/src/" \
            "$PWD/CMakeLists.txt"
          do
            if strings "$a" | grep -F "$n"; then
              echo "false-green: absolute needle in Debug archive: $n" >&2
              exit 1
            fi
            if strings "$a" | grep -F "file-prefix-map=$n"; then
              echo "false-green: prefix-map flag re-embedded: $n" >&2
              exit 1
            fi
          done
          archive="$PWD/$a"
          tmp=$(mktemp -d)
          (cd "$tmp" && ar x "$archive")
          test -n "$(ls -A "$tmp")"
          for o in "$tmp"/*; do
            if strings "$o" | grep -F "$PWD/"; then
              echo "false-green: absolute workspace path in object $o" >&2
              exit 1
            fi
            if strings "$o" | grep -F "file-prefix-map=$PWD"; then
              echo "false-green: prefix-map re-embedded in object $o" >&2
              exit 1
            fi
            # Inventory only: Clang may keep DWARF5 .debug_line_str when clean.
            if readelf -S "$o" 2>/dev/null | grep -q debug_line_str; then
              echo "note: $o has .debug_line_str (needles already scanned)"
            fi
          done
          rm -rf "$tmp"

  ubuntu-release-archive-cleanroom:
