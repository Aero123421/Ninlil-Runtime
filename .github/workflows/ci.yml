          test -f ports/esp-idf/smoke_app/sdkconfig.defaults.domain_schema1_on
          grep -F 'sdkconfig.defaults.domain_schema1_on' tools/esp_idf_ci_docker_run.sh
          python3 tools/domain_schema1_memory_gate.py self-test

  # ADR-0017 private Fabric: ON/OFF, direct normal/ASan, ILP32 evidence,
  # tests-OFF non-installed boundary. Not public ABI.
  fabric-v1-private:
    name: Fabric V1 private (OFF residual + ON normal + ASan + ILP32)
