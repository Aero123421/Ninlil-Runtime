  decoder-fuzz:
    name: Decoder fuzz (6 boundaries, 5 minutes each)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0
          check-latest: false
      - name: Install Clang and build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang libclang-rt-dev libsqlite3-dev libssl-dev ninja-build
      - name: Configure private libFuzzer targets
        run: |
          cmake -S . -B build/ci-decoder-fuzz -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DNINLIL_ENABLE_SANITIZERS=ON \
            -DNINLIL_ENABLE_R7_FRAG_PRIVATE=ON \
            -DNINLIL_ENABLE_PRIVATE_ROUTE_RELAY_V1=ON \
            -DNINLIL_BUILD_DECODER_FUZZERS=ON
      - name: Build all six harnesses
        run: >-
          cmake --build build/ci-decoder-fuzz --parallel 2
          --target ninlil_decoder_fuzzers
      - name: Generate and verify vector-derived seed corpus
        run: |
          python3 tools/decoder_fuzz_seed_corpus.py self-test
          python3 tools/decoder_fuzz_seed_corpus.py generate \
            --output build/ci-decoder-fuzz/corpus
          python3 tools/decoder_fuzz_seed_corpus.py check \
            --output build/ci-decoder-fuzz/corpus
      - name: Fuzz all decoder boundaries concurrently
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          build=$PWD/build/ci-decoder-fuzz
          mkdir -p "$build/fuzz-artifacts" "$build/fuzz-logs"
          specs=(
            ninlil_nfl1_codec_fuzzer:nfl1_codec
            ninlil_rrmp_codec_fuzzer:rrmp_codec
            ninlil_r7_wire_codec_fuzzer:r7_wire_codec
            ninlil_r7_frag_wire_fuzzer:r7_frag_wire
            ninlil_n6_record_codec_fuzzer:n6_record_codec
            ninlil_domain_store_body_codec_fuzzer:domain_store_body_codec
          )
          pids=()
          names=()
          for spec in "${specs[@]}"; do
            binary=${spec%%:*}
            corpus=${spec#*:}
            names+=("$binary")
            "$build/$binary" "$build/corpus/$corpus" \
              -max_total_time=300 -max_len=4096 -timeout=10 \
              -rss_limit_mb=2048 \
              -artifact_prefix="$build/fuzz-artifacts/$corpus-" \
              >"$build/fuzz-logs/$corpus.log" 2>&1 &
            pids+=("$!")
          done
          failed=0
          for i in "${!pids[@]}"; do
            if wait "${pids[$i]}"; then
              tail -n 8 "$build/fuzz-logs/${specs[$i]#*:}.log"
            else
              echo "fuzzer failed: ${names[$i]}" >&2
              cat "$build/fuzz-logs/${specs[$i]#*:}.log" >&2
              failed=1
            fi
          done
          exit "$failed"
      # actions/upload-artifact v4.6.2
      - name: Upload crash inputs and logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: decoder-fuzz-failure-${{ github.run_id }}
          path: |
            build/ci-decoder-fuzz/fuzz-artifacts
            build/ci-decoder-fuzz/fuzz-logs
            build/ci-decoder-fuzz/corpus/manifest.json
          if-no-files-found: error
          retention-days: 14

  # ADR-0021 private MFDT: default-OFF residual + feature-ON private suite.
  # Actual ESP compile/link/map is tools/esp_idf_ci_docker_run.sh (official amd64).
  # Does not promote SPEC_ACCEPTED. Physical HIL remains NOT_RUN via runner.
  mfdt-v1-private:
    name: MFDT V1 private (OFF residual + ON normal + ASan + host suite)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
