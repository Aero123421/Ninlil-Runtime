  # Dedicated pointer-compare sanitizer (docs/22). Ordinary ASan alone does
  # not enable invalid pointer-pair detection.
  clang-pointer-compare:
    name: Clang pointer-compare sanitizer
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0
          check-latest: false
      - name: Install SQLite3 and OpenSSL 3
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libsqlite3-dev libssl-dev
      - name: Configure pointer-compare sanitizer
        run: >-
          cmake -S . -B build/ci-clang-pointer-compare
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DNINLIL_ENABLE_POINTER_COMPARE_SANITIZER=ON
      - name: Build
        run: cmake --build build/ci-clang-pointer-compare --parallel 2
      - name: Test with detect_invalid_pointer_pairs=2
        env:
          ASAN_OPTIONS: detect_invalid_pointer_pairs=2:halt_on_error=1
        run: ctest --test-dir build/ci-clang-pointer-compare --output-on-failure
