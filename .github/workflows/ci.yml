          python3 tools/esp_idf_r7_frag_packaging_gate.py check

  # ADR-0019/0020 private route-relay/multi-parent: ON/OFF, normal/ASan/UBSan,
  # installed/tests-OFF boundary. ESP map/stack in esp-idf job. Physical NOT_RUN.
  rrmp-v1-private:
    name: RRMP V1 private (OFF residual + ON normal + ASan + boundary)
