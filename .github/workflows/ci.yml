        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0
          check-latest: false
      - name: Install build deps
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libsqlite3-dev libssl-dev ninja-build
      - name: Default-OFF residual (no MFDT private targets required)
        run: |
          cmake -S . -B build/mfdt-off -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNINLIL_BUILD_TESTS=ON \
            -DNINLIL_ENABLE_MFDT_V1_PRIVATE=OFF
          cmake --build build/mfdt-off --parallel 2 --target ninlil_runtime
          # Private MFDT tests must not be registered when OFF.
          if ctest --test-dir build/mfdt-off -N | grep -E 'mfdt_v1_'; then
            echo "false-green: mfdt_v1 tests registered with MFDT OFF" >&2
            exit 1
          fi
      - name: tests-OFF install surface
        run: |
          cmake -S . -B build/mfdt-tests-off -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNINLIL_BUILD_TESTS=OFF \
            -DNINLIL_ENABLE_MFDT_V1_PRIVATE=OFF
          cmake --build build/mfdt-tests-off --parallel 2
          cmake --install build/mfdt-tests-off --prefix build/mfdt-tests-off/install
          if find build/mfdt-tests-off/install -iname '*mfdt*' | grep -q .; then
            echo "false-green: mfdt path in tests-OFF install" >&2
            find build/mfdt-tests-off/install -iname '*mfdt*'
            exit 1
          fi
      - name: Feature-ON tests-OFF named private archive (fail-closed)
        run: |
          set -euo pipefail
          # MFDT feature ON + BUILD_TESTS=OFF:
          #   - private archive is EXCLUDE_FROM_ALL (named build only)
          #   - default "all" must not depend on it
          #   - CTest count for mfdt must be 0
          #   - install must not ship MFDT paths/symbols
          #   - public runtime archive must leak 0 MFDT symbols
          cmake -S . -B build/mfdt-on-tests-off -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNINLIL_BUILD_TESTS=OFF \
            -DNINLIL_ENABLE_MFDT_V1_PRIVATE=ON
          # Default all: must succeed without requiring private archive.
          cmake --build build/mfdt-on-tests-off --parallel 2
          # Named private archive only (not default all dependency).
          ninja -C build/mfdt-on-tests-off -t targets \
            | grep -E '^ninlil_runtime_private:' \
            || { echo "false-green: missing ninlil_runtime_private target" >&2; exit 1; }
          cmake --build build/mfdt-on-tests-off --parallel 2 \
            --target ninlil_runtime_private
          test -f build/mfdt-on-tests-off/libninlil_runtime_private.a
          # CTest must register zero MFDT tests under BUILD_TESTS=OFF.
          if ctest --test-dir build/mfdt-on-tests-off -N | grep -E 'mfdt_v1_'; then
            echo "false-green: mfdt_v1 tests registered with BUILD_TESTS=OFF" >&2
            ctest --test-dir build/mfdt-on-tests-off -N | grep -E 'mfdt_v1_' || true
            exit 1
          fi
          listed_off="$(ctest --test-dir build/mfdt-on-tests-off -N -R 'mfdt_v1_' | tail -n 1 || true)"
          echo "${listed_off}" | grep -E 'Total Tests: 0' \
            || test -z "$(ctest --test-dir build/mfdt-on-tests-off -N -R 'mfdt_v1_' | grep -E 'Test #')"
          cmake --install build/mfdt-on-tests-off --prefix build/mfdt-on-tests-off/install
          if find build/mfdt-on-tests-off/install -iname '*mfdt*' | grep -q .; then
            echo "false-green: mfdt path in feature-ON tests-OFF install" >&2
            find build/mfdt-on-tests-off/install -iname '*mfdt*'
            exit 1
          fi
          if find build/mfdt-on-tests-off/install -name 'libninlil_runtime_private.a' | grep -q .; then
            echo "false-green: private archive installed under tests-OFF" >&2
            exit 1
          fi
          # Public symbol leak = 0 (installed runtime or build-tree public .a).
          RT_A="build/mfdt-on-tests-off/install/lib/libninlil_runtime.a"
          if [[ ! -f "${RT_A}" ]]; then
            RT_A="build/mfdt-on-tests-off/libninlil_runtime.a"
          fi
          test -f "${RT_A}"
          if nm -g "${RT_A}" 2>/dev/null \
              | grep -E 'ninlil_mfdt_v1_' | grep -q .; then
            echo "false-green: mfdt symbols leaked into public runtime archive" >&2
            nm -g "${RT_A}" | grep 'ninlil_mfdt_v1_' | head
            exit 1
          fi
          # Private archive must carry MFDT when feature ON (named build only).
          if ! nm -g build/mfdt-on-tests-off/libninlil_runtime_private.a 2>/dev/null \
              | grep -E 'T _?ninlil_mfdt_v1_(spine_arm_sender|hil_full_promotion_enabled|ncl1_encode)' \
              | grep -q .; then
            echo "false-green: MFDT ON but named private archive missing MFDT symbols" >&2
            exit 1
          fi
      - name: Feature-ON normal private suite (introspected targets)
        run: |
          set -euo pipefail
          cmake -S . -B build/mfdt-on -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DNINLIL_BUILD_TESTS=ON \
            -DNINLIL_ENABLE_MFDT_V1_PRIVATE=ON
          # Fail-closed: every expected private target/test must exist.
          # lifecycle_test is mandatory (not optional soft membership).
          expected_tgts=(
            ninlil_mfdt_v1_unit_test ninlil_mfdt_v1_kat_test
            ninlil_mfdt_v1_fault_test ninlil_mfdt_v1_e2e_test
            ninlil_mfdt_v1_pipeline_test ninlil_mfdt_v1_media_cu_test
            ninlil_mfdt_v1_lifecycle_test ninlil_mfdt_v1_transport_sim_test
            ninlil_mfdt_v1_esp_store_cu_test
          )
          for t in "${expected_tgts[@]}"; do
            ninja -C build/mfdt-on -t targets | grep -E "^${t}:" \
              || { echo "false-green: missing MFDT target ${t}" >&2; exit 1; }
          done
          # Explicit lifecycle registration (CTest name + executable).
          ctest --test-dir build/mfdt-on -N \
            | grep -F 'mfdt_v1_lifecycle_private' \
            || { echo "false-green: mfdt_v1_lifecycle_private not registered" >&2; exit 1; }
          cmake --build build/mfdt-on --parallel 2 --target "${expected_tgts[@]}"
          listed="$(ctest --test-dir build/mfdt-on -N -R 'mfdt_v1_' | tail -n 1)"
          test "${listed}" != "Total Tests: 0"
          ctest --test-dir build/mfdt-on --output-on-failure --no-tests=error \
            -R 'mfdt_v1_'
      - name: Feature-ON ASan/UBSan private suite
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          set -euo pipefail
          cmake -S . -B build/mfdt-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DNINLIL_ENABLE_SANITIZERS=ON \
            -DNINLIL_BUILD_TESTS=ON \
            -DNINLIL_ENABLE_MFDT_V1_PRIVATE=ON
          # lifecycle_test is required in ASan targets (fail-closed).
          asan_tgts=(
            ninlil_mfdt_v1_unit_test ninlil_mfdt_v1_kat_test
            ninlil_mfdt_v1_fault_test ninlil_mfdt_v1_e2e_test
            ninlil_mfdt_v1_pipeline_test ninlil_mfdt_v1_media_cu_test
            ninlil_mfdt_v1_lifecycle_test
            ninlil_mfdt_v1_transport_sim_test ninlil_mfdt_v1_esp_store_cu_test
          )
          printf '%s\n' "${asan_tgts[@]}" | grep -Fx 'ninlil_mfdt_v1_lifecycle_test' \
            || { echo "false-green: lifecycle_test absent from ASan target list" >&2; exit 1; }
          for t in "${asan_tgts[@]}"; do
            ninja -C build/mfdt-asan -t targets | grep -E "^${t}:" \
              || { echo "false-green: missing MFDT ASan target ${t}" >&2; exit 1; }
          done
          cmake --build build/mfdt-asan --parallel 2 --target "${asan_tgts[@]}"
          # Regex must include lifecycle (mandatory; not soft).
          ASAN_CTEST_RE='mfdt_v1_(unit|kat|fault|e2e|pipeline|media_cu|lifecycle|transport_sim|esp_store_cu|hil|esp|dram)_'
          echo "${ASAN_CTEST_RE}" | grep -F 'lifecycle' \
            || { echo "false-green: ASan ctest regex missing lifecycle" >&2; exit 1; }
          ctest --test-dir build/mfdt-asan -N -R "${ASAN_CTEST_RE}" \
            | grep -F 'mfdt_v1_lifecycle_private' \
            || { echo "false-green: ASan suite does not select lifecycle_private" >&2; exit 1; }
          ctest --test-dir build/mfdt-asan --output-on-failure --no-tests=error \
            -R "${ASAN_CTEST_RE}"
      - name: ESP map proof contract (dry-run host) + authority pointer
        run: |
          # Host-side contract only. Actual linux/amd64 compile/link/map is
          # tools/esp_idf_ci_docker_run.sh (sole immutable ESP-IDF launcher).
          NINLIL_ESP_CI_DRY_RUN=1 tools/mfdt_v1_esp_idf_map_proof.sh
          grep -F 'sdkconfig.defaults.mfdt_on' tools/esp_idf_ci_docker_run.sh
      - name: HIL runner NOT_RUN evidence
        run: |
          python3 tools/ninlil_hil/mfdt_v1_hil_runner.py \
            --out build/mfdt_v1_hil_not_run.json
          grep -F '"status": "NOT_RUN"' build/mfdt_v1_hil_not_run.json
          grep -F '"full_esp_hil_attested": false' build/mfdt_v1_hil_not_run.json

  # ADR-0018 private Wi-Fi v1: default-OFF residual + feature-ON unit/e2e/ASan.
  # Actual ESP wifi_hil compile/link/map: tools/esp_idf_ci_docker_run.sh.
  # ADR/vectors remain Proposed. Physical AP HIL = NOT_RUN (executable runner).
  # Host OpenSSL 3.5.7 pin may be absent on runner → ALLOW_UNPINNED for LAB only.
  wifi-v1-private:
    name: Wi-Fi V1 private (OFF residual + ON normal + ASan + gates)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0
          check-latest: false
      - name: Install build deps
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libsqlite3-dev libssl-dev ninja-build
      - name: Default-OFF residual (no wifi_v1 private tests)
        run: |
          cmake -S . -B build/wifi-off -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNINLIL_BUILD_TESTS=ON \
            -DNINLIL_ENABLE_PRIVATE_WIFI_V1=OFF \
            -DNINLIL_ENABLE_PRIVATE_FABRIC_V1=OFF
          cmake --build build/wifi-off --parallel 2 --target ninlil_runtime
          if ctest --test-dir build/wifi-off -N | grep -E 'wifi_v1_'; then
            echo "false-green: wifi_v1 tests registered with WIFI OFF" >&2
            exit 1
          fi
      - name: tests-OFF install surface (default WIFI OFF — no wifi private install)
        run: |
          cmake -S . -B build/wifi-tests-off -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNINLIL_BUILD_TESTS=OFF \
            -DNINLIL_ENABLE_PRIVATE_WIFI_V1=OFF
          cmake --build build/wifi-tests-off --parallel 2
          cmake --install build/wifi-tests-off --prefix build/wifi-tests-off/install
          if find build/wifi-tests-off/install -iname '*wifi_v1*' | grep -q .; then
            echo "false-green: wifi_v1 path in tests-OFF install" >&2
            find build/wifi-tests-off/install -iname '*wifi_v1*'
            exit 1
          fi
      - name: Feature-ON tests-OFF install non-exposure (private EXCLUDE_FROM_ALL)
        run: |
          set -euo pipefail
          cmake -S . -B build/wifi-on-tests-off -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DNINLIL_BUILD_TESTS=OFF \
            -DNINLIL_ENABLE_PRIVATE_WIFI_V1=ON \
            -DNINLIL_WIFI_ALLOW_UNPINNED_OPENSSL=ON
          # Private archive builds only when named; default all must not require it.
          cmake --build build/wifi-on-tests-off --parallel 2
          cmake --build build/wifi-on-tests-off --parallel 2 --target ninlil_wifi_v1_private
          cmake --install build/wifi-on-tests-off --prefix build/wifi-on-tests-off/install
          if find build/wifi-on-tests-off/install -iname '*wifi*' | grep -q .; then
            echo "false-green: wifi path in feature-ON tests-OFF install" >&2
            find build/wifi-on-tests-off/install -iname '*wifi*'
            exit 1
          fi
          if ctest --test-dir build/wifi-on-tests-off -N | grep -E 'wifi_v1_'; then
            echo "false-green: wifi_v1 tests registered with BUILD_TESTS=OFF" >&2
            exit 1
          fi
      - name: Spec gate + vector generator (Proposed; no promotion)
        run: |
          python3 tools/wifi_bearer_spec_vector_gen.py --check
          python3 tools/wifi_bearer_spec_gate.py --check
      - name: Feature-ON normal private suite + host e2e
        run: |
          set -euo pipefail
          cmake -S . -B build/wifi-on -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DNINLIL_BUILD_TESTS=ON \
            -DNINLIL_ENABLE_PRIVATE_WIFI_V1=ON \
            -DNINLIL_ENABLE_PRIVATE_FABRIC_V1=ON \
            -DNINLIL_WIFI_ALLOW_UNPINNED_OPENSSL=ON
          wifi_tgts=(
            ninlil_wifi_v1_private
            wifi_v1_nwb1_test wifi_v1_credentials_test wifi_v1_leaf_binding_test
            wifi_v1_journal_test wifi_v1_storage_commit_unknown_test
            wifi_v1_reconnect_test wifi_v1_exporter_kat_test
            wifi_v1_attachment_gate_test wifi_v1_esp_owner_test
            wifi_v1_esp_owner_sm_test wifi_v1_tls_arena_test
            wifi_v1_r7_other_registered_fault_test
            wifi_v1_esp_tls_identity_matrix_test wifi_v1_m4_evidence_test
            wifi_v1_m4_forge_probe_test wifi_v1_m4_owner_concurrency_test
            wifi_v1_m4_stale_load_barrier_test wifi_v1_queue_drop_wrap_test
            wifi_v1_tls_storage_align_test wifi_v1_fabric_link_test
            wifi_v1_adapter_lifecycle_test wifi_v1_esp_adapter_e2e_test
            wifi_v1_actual_adapter_fabric_e2e_test
            wifi_v1_reconnect_tsan_test
            wifi_v1_host_e2e_driver
          )
          cmake --build build/wifi-on --parallel 2 --target "${wifi_tgts[@]}"
          listed="$(ctest --test-dir build/wifi-on -N -R 'wifi_v1_' | tail -n 1)"
          test "${listed}" != "Total Tests: 0"
          # wifi_v1_host_e2e is fixed to FRAMES=200 by its CTest property.
          # The pinned-authority job owns the sole full 10k release evidence.
          ctest --test-dir build/wifi-on --output-on-failure --no-tests=error \
            -R 'wifi_v1_'
          python3 tools/wifi_v1_openssl_pin_provenance.py --report-only \
            | tee build/wifi-on/openssl_pin_provenance.json
          # ADR-0018 not promoted: authority_claim_allowed must not be assumed.
          grep -F '"authority_claim_allowed": false' build/wifi-on/openssl_pin_provenance.json \
            || grep -F '"authority_claim_allowed": true' build/wifi-on/openssl_pin_provenance.json
      - name: Feature-ON ASan/UBSan private suite
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
          # CTest fixes the host E2E at FRAMES=200 for every standard matrix.
        run: |
          set -euo pipefail
          cmake -S . -B build/wifi-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DNINLIL_ENABLE_SANITIZERS=ON \
            -DNINLIL_BUILD_TESTS=ON \
            -DNINLIL_ENABLE_PRIVATE_WIFI_V1=ON \
            -DNINLIL_ENABLE_PRIVATE_FABRIC_V1=ON \
            -DNINLIL_WIFI_ALLOW_UNPINNED_OPENSSL=ON
          wifi_tgts=(
            ninlil_wifi_v1_private
            wifi_v1_nwb1_test wifi_v1_credentials_test wifi_v1_leaf_binding_test
            wifi_v1_journal_test wifi_v1_storage_commit_unknown_test
            wifi_v1_reconnect_test wifi_v1_exporter_kat_test
            wifi_v1_attachment_gate_test wifi_v1_esp_owner_test
            wifi_v1_esp_owner_sm_test wifi_v1_tls_arena_test
            wifi_v1_r7_other_registered_fault_test
            wifi_v1_esp_tls_identity_matrix_test wifi_v1_m4_evidence_test
            wifi_v1_m4_forge_probe_test wifi_v1_m4_owner_concurrency_test
            wifi_v1_m4_stale_load_barrier_test wifi_v1_queue_drop_wrap_test
            wifi_v1_tls_storage_align_test wifi_v1_fabric_link_test
            wifi_v1_adapter_lifecycle_test wifi_v1_esp_adapter_e2e_test
            wifi_v1_actual_adapter_fabric_e2e_test
            wifi_v1_host_e2e_driver
          )
          cmake --build build/wifi-asan --parallel 2 --target "${wifi_tgts[@]}"
          ctest --test-dir build/wifi-asan --output-on-failure --no-tests=error \
            -R 'wifi_v1_'
      - name: Feature-ON TSan (library body + concurrency + stale-load)
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: |
          set -euo pipefail
          # Instruments ninlil_wifi_v1_private via NINLIL_ENABLE_TSAN (non-Apple).
          cmake -S . -B build/wifi-tsan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DNINLIL_ENABLE_TSAN=ON \
            -DNINLIL_BUILD_TESTS=ON \
            -DNINLIL_ENABLE_PRIVATE_WIFI_V1=ON \
            -DNINLIL_ENABLE_PRIVATE_FABRIC_V1=ON \
            -DNINLIL_WIFI_ALLOW_UNPINNED_OPENSSL=ON
          wifi_tgts=(
            ninlil_wifi_v1_private
            ninlil_wifi_v1_m4_hooks
            wifi_v1_m4_owner_concurrency_test
            wifi_v1_m4_owner_concurrency_tsan_test
            wifi_v1_m4_stale_load_barrier_test
            wifi_v1_m4_stale_load_barrier_tsan_test
            wifi_v1_m4_evidence_test
            wifi_v1_m4_forge_probe_test
          )
          cmake --build build/wifi-tsan --parallel 2 --target "${wifi_tgts[@]}"
          ctest --test-dir build/wifi-tsan --output-on-failure --no-tests=error \
            -R 'wifi_v1_m4_'
      - name: ESP map proof contract (dry-run host) + authority pointer
        run: |
          # Host contract only. Actual wifi_hil esp32s3 build is in
          # tools/esp_idf_ci_docker_run.sh (immutable linux/amd64 image).
          NINLIL_ESP_CI_DRY_RUN=1 tools/wifi_v1_esp_idf_map_proof.sh
          grep -F 'wifi_hil_app' tools/esp_idf_ci_docker_run.sh
      - name: Physical AP HIL runner NOT_RUN evidence
        run: |
          python3 tools/ninlil_hil/wifi_v1_hil_runner.py \
            --out build/wifi_v1_hil_not_run.json
          grep -F '"status": "NOT_RUN"' build/wifi_v1_hil_not_run.json
          grep -F '"full_esp_hil_attested": false' build/wifi_v1_hil_not_run.json
          grep -F '"physical_ap_hil": "NOT_RUN"' build/wifi_v1_hil_not_run.json

  # Host authority is deliberately separate from the system-OpenSSL LAB job.
  # Both supported Host OS families build the exact official 3.5.7 archive,
  # link static libssl/libcrypto, exercise real TLS/TCP, and fail closed unless
  # the final binary + provenance gate prove the complete authority chain.
  wifi-v1-openssl-authority:
    name: Wi-Fi pinned OpenSSL authority (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0
          check-latest: false
      - name: Install Host build dependencies (Linux)
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libsqlite3-dev ninja-build perl make
      - name: Install Host build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Build exact static OpenSSL 3.5.7
        env:
          NINLIL_OPENSSL_BUILD_ROOT: ${{ runner.temp }}/ninlil-openssl-3.5.7
          NINLIL_OPENSSL_DOWNLOAD_ROOT: ${{ runner.temp }}/ninlil-openssl-downloads
          NINLIL_OPENSSL_BUILD_JOBS: "2"
        run: |
          tools/wifi_v1_build_pinned_openssl.sh
          find "${NINLIL_OPENSSL_BUILD_ROOT}/install" -type f \
            -name libssl.a -print -quit | grep -q .
          find "${NINLIL_OPENSSL_BUILD_ROOT}/install" -type f \
            -name libcrypto.a -print -quit | grep -q .
      - name: Configure and build pinned static authority
        env:
          PIN_ROOT: ${{ runner.temp }}/ninlil-openssl-3.5.7/install
        run: |
          cmake -S . -B build/wifi-authority -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DNINLIL_BUILD_TESTS=ON \
            -DNINLIL_ENABLE_PRIVATE_WIFI_V1=ON \
            -DNINLIL_ENABLE_PRIVATE_FABRIC_V1=ON \
            -DNINLIL_WIFI_OPENSSL_AUTHORITY=ON \
            "-DNINLIL_WIFI_OPENSSL_AUTHORITY_ROOT=${PIN_ROOT}"
          cmake --build build/wifi-authority --parallel 2
      - name: Wi-Fi private suite and real TLS/TCP authority E2E
        env:
          NINLIL_WIFI_REQUIRE_AUTHORITY: "1"
          FRAMES: "10000"
          OPENSSL_BIN: ${{ runner.temp }}/ninlil-openssl-3.5.7/install/bin/openssl
        run: |
          # Exclude the registered bounded sample, then run the exact full 10k
          # path once as pinned-authority release evidence.
          ctest --test-dir build/wifi-authority \
            --output-on-failure --no-tests=error \
            -R 'wifi_v1_' -E '^wifi_v1_host_e2e$'
          tools/wifi_v1_run_host_e2e.sh \
            build/wifi-authority/wifi_v1_host_e2e_driver
      - name: Final binary static-link and provenance authority
        env:
          PIN_ROOT: ${{ runner.temp }}/ninlil-openssl-3.5.7/install
          PIN_SOURCE: ${{ runner.temp }}/ninlil-openssl-downloads/openssl-3.5.7.tar.gz
        run: |
          ninja -C build/wifi-authority -t commands \
            wifi_v1_host_e2e_driver \
            | tee build/wifi-authority/wifi_v1_host_e2e_driver.link.txt
          python3 tools/wifi_v1_openssl_pin_provenance.py \
            --root "${PIN_ROOT}" \
            --source-archive "${PIN_SOURCE}" \
            --cmake-cache build/wifi-authority/CMakeCache.txt \
            --link-evidence \
              build/wifi-authority/wifi_v1_host_e2e_driver.link.txt \
            --binary build/wifi-authority/wifi_v1_host_e2e_driver \
            | tee build/wifi-authority/openssl_pin_provenance.json
          grep -F '"authority_claim_allowed": true' \
            build/wifi-authority/openssl_pin_provenance.json
          grep -F '"provenance_status": "OK"' \
            build/wifi-authority/openssl_pin_provenance.json

  # ADR-0022 Domain schema1: feature ON + default OFF, normal + ASan/UBSan,
  # tests-OFF install consumer / symbol boundary. No status promotion.
  domain-schema1-runtime:
    name: Domain schema1 (OFF residual + ON normal + ASan + tests-OFF)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false
      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0
          check-latest: false
      - name: Install build deps
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libsqlite3-dev libssl-dev ninja-build binutils
      - name: Domain schema1 full host matrix
        run: bash tools/ci_completion_feature_host_matrix.sh domain_schema1 all_profiles
