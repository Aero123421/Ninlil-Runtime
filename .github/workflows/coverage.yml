name: Clang coverage map

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  coverage-map:
    name: Non-threshold C/C++ coverage artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.18.0
          check-latest: false
      - name: Install Clang and build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang llvm libsqlite3-dev libssl-dev ninja-build
      - name: Build and execute focused instrumented smoke
        env:
          LLVM_PROFILE_FILE: ${{ github.workspace }}/build/coverage-raw/%p.profraw
        run: |
          cmake -S . -B build/coverage -G Ninja \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_FLAGS='-fprofile-instr-generate -fcoverage-mapping' \
            -DCMAKE_EXE_LINKER_FLAGS='-fprofile-instr-generate' \
            -DCMAKE_SHARED_LINKER_FLAGS='-fprofile-instr-generate'
          cmake --build build/coverage \
            --target ninlil_v1_runtime_delivery_test --parallel 2
          ctest --test-dir build/coverage --output-on-failure \
            -R '^v1_runtime_delivery$'
          python3 tools/clang_coverage_artifact.py \
            --binary build/coverage/ninlil_v1_runtime_delivery_test \
            --profraw-dir build/coverage-raw --out build/coverage-artifact
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clang-coverage-map
          path: build/coverage-artifact
          if-no-files-found: error
