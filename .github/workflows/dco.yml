# SPDX-License-Identifier: Apache-2.0
name: DCO sign-off

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    name: Sign-off trailers
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify DCO 1.1 sign-off
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git show "${BASE_SHA}:tools/dco_signoff_gate.py" > "${RUNNER_TEMP}/dco_signoff_gate.py"
          python3 "${RUNNER_TEMP}/dco_signoff_gate.py" self-test
          python3 "${RUNNER_TEMP}/dco_signoff_gate.py" check-range "${BASE_SHA}" "${HEAD_SHA}"
