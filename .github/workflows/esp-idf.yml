# ESP-IDF target build (M3-prep + M3-basic + experimental owner/cell/loopback
# + durable-storage + U2 A2 CDC adapter + R7 T0 crypto / T1 wire / T1b binding
# target gates). Separated from host GCC/Clang CI in ci.yml.
# Pins the official ESP-IDF linux/amd64 image by immutable OCI manifest digest;
# its v5.5.3 tag/version authority is recorded in dependency-inventory.json.
# Smoke links clock/entropy/execution + owner-task/cell/loopback + storage + U2 CDC
# + the R7 private mbedTLS provider, T1b context binding, and T1 wire codec into
# the final ESP32-S3 ELF.
# Evidence is esp32s3 compile/link only — not device HIL / dual-core race PASS /
# physical power-cut HIL / U2 host CDC roundtrip / device KAT / RF / FIELD.
# Does not claim M3 complete, U2 complete, USB series complete, R7 complete,
# T1b Accepted, radio, or hardware verify.

name: ESP-IDF

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
    inputs:
      source-ref:
        description: Exact source commit to verify
        required: false
        type: string
      workflow-definition-ref:
        description: Exact commit containing this reusable workflow definition
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  esp32s3-component-build:
    # Default smoke/HIL + feature-ON overlays (R7 FRAG, MFDT, RRMP, Domain,
    # Wi-Fi hil, SX1262 radio_hil). Physical HIL remains NOT_RUN evidence only.
    name: ESP32-S3 component build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash --noprofile --norc -euo pipefail {0}
    steps:
      # actions/checkout v7.0.0 (same pin as host ci.yml)
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          persist-credentials: false

      - name: Verify workflow and runner identity
        env:
          EXPECTED_WORKFLOW_COMMIT: ${{ inputs.workflow-definition-ref || github.workflow_sha }}
          ACTUAL_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
        run: |
          test "${ACTUAL_WORKFLOW_COMMIT}" = "${EXPECTED_WORKFLOW_COMMIT}"
          test "$(uname -m)" = "x86_64"

      - name: Read pinned ESP-IDF version
        id: pin
        run: |
          pin="$(tr -d '[:space:]' < ports/esp-idf/ESP_IDF_VERSION)"
          if [[ ! "$pin" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "invalid ESP_IDF_VERSION: $pin" >&2
            exit 1
          fi
          echo "version=$pin" >> "$GITHUB_OUTPUT"
          echo "Pinned ESP-IDF: $pin"

      - name: Resolve storage partition paths
        run: |
          test -f ports/esp-idf/partitions/ninlil_storage.csv
          test -f ports/esp-idf/hil_app/../partitions/ninlil_storage.csv
          rel="$(sed -n 's/^CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="\(.*\)"/\1/p' \
            ports/esp-idf/smoke_app/sdkconfig.defaults | head -1)"
          test "$rel" = "../partitions/ninlil_storage.csv"
          test -f "ports/esp-idf/smoke_app/${rel}"

      - name: U2 exact esp_tinyusb pin + committed locks (no drift)
        run: |
          # Real Python hygiene/lock gate (comment-safe; structural lock version).
          python3 tools/esp_usb_cdc_u2_gate.py check
          # Never commit managed_components / build trees
          test ! -d ports/esp-idf/smoke_app/managed_components
          test ! -d ports/esp-idf/hil_app/managed_components
          test ! -d ports/esp-idf/radio_hil_app/managed_components
          test ! -d ports/esp-idf/wifi_hil_app/managed_components
          test ! -f ports/esp-idf/smoke_app/sdkconfig.old
          test ! -f ports/esp-idf/hil_app/sdkconfig.old
          # Feature-ON overlays must exist (actual builds consume them).
          test -f ports/esp-idf/smoke_app/sdkconfig.defaults.r7_frag_on
          test -f ports/esp-idf/smoke_app/sdkconfig.defaults.v1_lab_radio_path_on
          test -f ports/esp-idf/smoke_app/sdkconfig.defaults.mfdt_on
          test -f ports/esp-idf/smoke_app/sdkconfig.defaults.rrmp_on
          test -f ports/esp-idf/smoke_app/sdkconfig.defaults.domain_schema1_on
          # Combined all-private-features overlay is mandatory (not substitutable
          # by individual overlays alone).
          test -f ports/esp-idf/smoke_app/sdkconfig.defaults.all_private_features_on
          grep -F 'CONFIG_NINLIL_ENABLE_MFDT_V1_PRIVATE=y' \
            ports/esp-idf/smoke_app/sdkconfig.defaults.all_private_features_on
          grep -F 'CONFIG_NINLIL_ENABLE_PRIVATE_WIFI_V1=y' \
            ports/esp-idf/smoke_app/sdkconfig.defaults.all_private_features_on
          grep -F 'CONFIG_NINLIL_ENABLE_PRIVATE_ROUTE_RELAY_V1=y' \
            ports/esp-idf/smoke_app/sdkconfig.defaults.all_private_features_on
          grep -F 'CONFIG_NINLIL_ENABLE_V1_LAB_RADIO_PATH=y' \
            ports/esp-idf/smoke_app/sdkconfig.defaults.all_private_features_on
          grep -F 'sdkconfig.defaults.all_private_features_on' \
            tools/esp_idf_ci_docker_run.sh
          test -d ports/esp-idf/radio_hil_app
          test -d ports/esp-idf/wifi_hil_app

      - name: Build combined smoke + feature-ON + radio_hil (official amd64)
        # Official Espressif image via sole authorized launcher script.
        # Image digest + linux/amd64 + N6 collection + in-container gates live in:
        # tools/esp_idf_ci_docker_run.sh (packaging + N6 structure authority).
        # Builds: default smoke/hil, individual feature-ON overlays, and the
        # mandatory combined all-private-features-on overlay (not substitutable
        # by individual overlays alone), wifi_hil, radio_hil/SX1262.
        # Physical HIL is NOT_RUN evidence only.
        # Pinned image identity (executed only by the launcher script):
        # docker.io/espressif/idf@sha256:3e77b709e0ba7f0e9a711039231103be822736b4105790b8e33339a3bf4e47fb
        # Pin is a real shell argv (not a GHA expression inside the script):
        run: bash tools/esp_idf_ci_docker_run.sh "${{ steps.pin.outputs.version }}"

      - name: Enforce target storage stack budget
        run: |
          test -s ports/esp-idf/smoke_app/build/ninlil_su_list.txt
          python3 tools/esp_storage_stack_gate.py --require-su --require-model \
            ports/esp-idf/smoke_app/build

      - name: Feature-ON ESP evidence present (fail-closed, not dry-run)
        run: |
          set -euo pipefail
          # R7 FRAG ON
          test -s ports/esp-idf/smoke_app/build-r7frag-on/ninlil_m3_combined_smoke.elf
          test -s ports/esp-idf/smoke_app/build-r7frag-on/ninlil_m3_combined_smoke.map
          # MFDT ON
          test -s ports/esp-idf/smoke_app/build-mfdt-on/ninlil_m3_combined_smoke.elf
          test -s ports/esp-idf/smoke_app/build-mfdt-on/ninlil_m3_combined_smoke.map
          # RRMP ON
          test -s ports/esp-idf/smoke_app/build-rrmp-on/ninlil_m3_combined_smoke.elf
          test -s ports/esp-idf/smoke_app/build-rrmp-on/ninlil_m3_combined_smoke.map
          # Domain schema1 ON
          test -s ports/esp-idf/smoke_app/build-domain-schema1-on/ninlil_m3_combined_smoke.elf
          test -s ports/esp-idf/smoke_app/build-domain-schema1-on/ninlil_m3_combined_smoke.map
          # ALL private features simultaneous ON (combined overlay; required)
          test -s ports/esp-idf/smoke_app/build-all-private-features-on/ninlil_m3_combined_smoke.elf
          test -s ports/esp-idf/smoke_app/build-all-private-features-on/ninlil_m3_combined_smoke.map
          test -s ports/esp-idf/smoke_app/build-all-private-features-on/config/sdkconfig.h
          grep -E 'CONFIG_NINLIL_ENABLE_MFDT_V1_PRIVATE 1' \
            ports/esp-idf/smoke_app/build-all-private-features-on/config/sdkconfig.h
          grep -E 'CONFIG_NINLIL_ENABLE_PRIVATE_WIFI_V1 1' \
            ports/esp-idf/smoke_app/build-all-private-features-on/config/sdkconfig.h
          grep -E 'CONFIG_NINLIL_ENABLE_PRIVATE_ROUTE_RELAY_V1 1' \
            ports/esp-idf/smoke_app/build-all-private-features-on/config/sdkconfig.h
          grep -E 'CONFIG_NINLIL_ENABLE_V1_LAB_RADIO_PATH 1' \
            ports/esp-idf/smoke_app/build-all-private-features-on/config/sdkconfig.h
          # Individual overlays alone are not a substitute for the combined tree.
          test -d ports/esp-idf/smoke_app/build-mfdt-on
          test -d ports/esp-idf/smoke_app/build-all-private-features-on
          test "ports/esp-idf/smoke_app/build-mfdt-on" != \
            "ports/esp-idf/smoke_app/build-all-private-features-on"
          # Wi-Fi hil
          test -s ports/esp-idf/wifi_hil_app/build/ninlil_wifi_hil.elf
          test -s ports/esp-idf/wifi_hil_app/build/ninlil_wifi_hil.map
          # SX1262 radio_hil compile/link + physical NOT_RUN evidence
          test -s ports/esp-idf/radio_hil_app/build/ninlil_radio_hil.elf
          test -s ports/esp-idf/radio_hil_app/build/ninlil_radio_hil.map
          test -s ports/esp-idf/radio_hil_app/build/ninlil_radio_hil_evidence.json
          test -s ports/esp-idf/radio_hil_app/build/ninlil_radio_hil_physical.json
          grep -F '"physical_status": "NOT_RUN"' \
            ports/esp-idf/radio_hil_app/build/ninlil_radio_hil_physical.json
          grep -F '"physical_powercut_pass": false' \
            ports/esp-idf/radio_hil_app/build/ninlil_radio_hil_physical.json
